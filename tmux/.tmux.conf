# Prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# Shell
set -g default-shell /opt/homebrew/bin/fish

# Colors
set -g default-terminal "screen-256color"
set -ag terminal-overrides ",tmux-256color:RGB"

# Numbering from 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# No delay on Escape (important for nvim)
set -sg escape-time 0

# Mouse
set -g mouse on

# Split panes, keep current path
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# sesh — fuzzy session/project switcher popup (prefix + T)
bind-key "T" run-shell " \
  session=\$(sesh list --icons | fzf-tmux -p 80%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^f find ^d kill' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 3 -t d -E .git -E node_modules . ~/projects ~/.config)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
    --preview-window 'right:55%' \
    --preview 'sesh preview {}'); \
  [ -n \"\$session\" ] && sesh connect \"\$session\" \
"

# Pane navigation with Option+Arrow (no prefix)
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# Vi keys in copy mode
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection

# Statusbar — zenwritten light palette
set -g status-style         "bg=#f0ede6,fg=#4a4540"
set -g status-left          " #[bold]#S#[nobold]  "
set -g status-right         "#(~/.tmux/scripts/claude-cost.sh)  %a %b %-d  %H:%M "
set -g status-left-length   20
set -g status-right-length  40
set -g status-position      bottom
set -g status-interval      300

setw -g window-status-format         " #I #W "
setw -g window-status-current-format " #[bold]#I #W#[nobold] "
setw -g window-status-current-style  "fg=#1a1614"

set -g pane-border-style        "fg=#d6d0c8"
set -g pane-active-border-style "fg=#a09890"
set -g message-style            "bg=#e8e0d8,fg=#2a2420"

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'samleeney/tmux-agent-status'

# Continuum: auto-save every 5 min, restore on start
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'

run '~/.tmux/plugins/tpm/tpm'
